{% extends 'base.html' %}

{% block title %}Parol o'zgartirish | HERMES{% endblock %}

{% block page_title %}Parol o'zgartirish{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title"><i class="bi bi-key me-2"></i>Parol o'zgartirish</h5>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Joriy parol</label>
                            <input type="password" name="current_password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Yangi parol</label>
                            <input type="password" name="new_password" class="form-control" required minlength="6">
                            <small class="text-muted">Kamida 6 ta belgi</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Yangi parolni tasdiqlang</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                    </div>

                    <div class="card-footer d-flex justify-content-between">
                        <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Orqaga
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> O'zgartirish
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
